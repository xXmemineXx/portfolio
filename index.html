<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/main_style.css">
    <title>xXmemineXx</title>
</head>
<body>
    <!--datas-->
    <script src="./scripts/datas/about.js"></script>
    <script src="./scripts/datas/projects.js"></script>
    <script src="./scripts/datas/skills.js"></script>
    <script src="./scripts/datas/studies.js"></script>

    <!--my js dependencies-->
    <script src="./scripts/classes/info.js"></script>
    <script src="./scripts/classes/list_item.js"></script>
    <script src="./scripts/classes/toogler.js"></script>

    <!--main script-->

    <script src="./scripts/main.js" defer></script>
    <!-- main container for the informations to read -->
    <div class="main_container">
        <div class="container_frontier">

        </div>

        <div class="toogler">
            <div class="scroll_message">
                <!--from top-->
                <div class="floater-top floater first"></div>
                <div class="floater-top floater second"></div>
                <div class="floater-top floater third"></div>
                <div class="floater-top floater fourth"></div>
                <!--from bottom-->
                <div class="floater-bottom floater first"></div>
                <div class="floater-bottom floater second"></div>
                <div class="floater-bottom floater third"></div>
                <div class="floater-bottom floater fourth"></div>
            </div>

            <h1 id="topic"> current topic </h1>
            <div class="information">
                <div class="part1 container">
                    <div class="text">
                        <h3 id="viewd">
                        </h3>
                        <img src="./media/images/test1.jpeg"/>
                    </div>
                    <div class="curve-right"></div>
                    <div id="list" class="list">
                        
                    </div>
                </div>

                <div class="part2 container">
                    <div class="curve-left"></div>
                    <div class="text">
                        <h3> description </h3>
                        <p id="description">
                        
                        </p>
                    </div>
                    <div class="list" id="list2">

                    </div>
                </div>
            </div>

            <div class="section_border floater"></div>
        </div>
    </div>

    <!-- section chooser's container -->
    <div class="holder"></div>
    <div class="chooser">
       <div class="item0" id="view">
       </div>
       <div class="item1 items" id="option1" onclick="topic1 = toogle(topic1)">
       </div>
       <div class="item2 items" id="option2" onclick="topic2 = toogle(topic2)">
       </div> 
       <div class="item3 items" id="option3" onclick="topic3 = toogle(topic3)">
       </div> 

    </div>

    <!-- container for the animated hand (or heart still not decided) -->
    <div class="hand_container">
        <div class="hand">
            <h2> xXmemineXx's portfolio </h2>
            <div class="img magic">
                <img src="./media/icons/circle.png" class="img">
                <div class="img" id="img-holder">
                    <img src="./media/icons/icons8-call-30.png" class="actions" id="call"/>
                    <img src="./media/icons/icons8-github-logo-30.png" class="actions" id="git"/>
                    <img src="./media/icons/icons8-call-30.png" class="actions" id="mail"/>
                </div>
            </div>
            <div class="action-description">
                <p>description</p>
            </div>
        </div>
    </div>

</body>
</html>
